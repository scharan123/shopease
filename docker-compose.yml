# ============================================================
# ShopEase — Production Docker Compose
# Each service runs on its own port for individual deployment
# ============================================================

version: '3.8'

services:
  # ---- MySQL Database ----
  db:
    image: mysql:8.0
    container_name: shopease_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-ecommerce}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopease

  # ---- Backend API (Port 5000) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopease_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=db
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_NAME=${DB_NAME:-ecommerce}
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ADMIN_URL=${ADMIN_URL:-http://localhost:3001}
      - CUSTOMER_SUPPORT_URL=${CUSTOMER_SUPPORT_URL:-http://localhost:3002}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    ports:
      - "5000:5000"
    networks:
      - shopease

  # ---- Frontend Storefront (Port 3000) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopease_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - shopease

  # ---- Admin Dashboard (Port 3001) ----
  admin_dashboard:
    build:
      context: ./admin_dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_ADMIN_API_URL:-http://localhost:5000/api}
    container_name: shopease_admin
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - shopease

  # ---- Customer Support Portal (Port 3002) ----
  customer_support:
    build:
      context: ./customer_support
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_CUSTOMER_API_URL:-http://localhost:5000/api}
    container_name: shopease_customer
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - shopease

  # ---- Nginx Reverse Proxy (Port 80) ----
  nginx:
    image: nginx:1.27-alpine
    container_name: shopease_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - admin_dashboard
      - customer_support
    networks:
      - shopease

volumes:
  db_data:

networks:
  shopease:
    driver: bridge
